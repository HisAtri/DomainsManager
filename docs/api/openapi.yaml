openapi: 3.1.0
info:
  title: DomainsManager API
  version: 0.1.0
  summary: DomainsManager 后端 API 初版契约
  description: |
    本文档定义 FastAPI HTTP 接口。健康检查、本地认证、当前用户、用户域名、刷新任务、检查历史和基础管理员接口已实现。OAuth2 仅提供 Provider 配置状态；真实第三方授权和账号绑定仍待实现。
    所有时间均为 UTC RFC 3339 时间；除公开认证端点外均使用 Bearer Access Token。
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Current user
  - name: OAuth2
  - name: Domains
  - name: Tasks
  - name: Admin users
  - name: Admin domains
  - name: Health
  - name: Notifications
security:
  - bearerAuth: []
paths:
  /notification-rules/deliveries:
    get:
      tags: [Notifications]
      operationId: listNotificationDeliveries
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Notification delivery history for the current user
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NotificationDelivery' } }
  /notification-rules:
    get:
      tags: [Notifications]
      operationId: listNotificationRules
      responses:
        '200':
          description: Notification rules
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NotificationRule' } }
    post:
      tags: [Notifications]
      operationId: createNotificationRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotificationRuleRequest' }
      responses:
        '201':
          description: Notification rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRule' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /notification-rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Notifications]
      operationId: getNotificationRule
      responses:
        '200':
          description: Notification rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRule' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Notifications]
      operationId: updateNotificationRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotificationRuleRequest' }
      responses:
        '200':
          description: Notification rule updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRule' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Notifications]
      operationId: deleteNotificationRule
      responses:
        '204': { description: Notification rule deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 进程存活检查
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: 服务进程存活
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 服务就绪检查
      description: 检查数据库连接，不访问外部 RDAP/WHOIS 服务。
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: 服务可接收业务请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: 注册本地用户
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '403':
          description: 注册功能已关闭（`registration_disabled`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 用户名已存在（`username_taken`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 使用用户名和密码登录
      description: 采用 OAuth2 Password 风格表单。账号不存在、密码错误或账号不可用统一返回 `invalid_credentials`。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 撤销当前会话
      description: 使用 Refresh Token 标识待撤销会话；无效、已撤销或重复请求仍然成功。
      security: []
      responses:
        '204': { description: 会话已撤销、不可用或原本不存在 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/token/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: 轮换 Refresh Token
      security: []
      responses:
        '200':
          description: Token 已轮换，原 Refresh Token 立即失效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      tags: [Current user]
      operationId: getCurrentUser
      summary: 获取当前用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Current user]
      operationId: updateCurrentUser
      summary: 修改当前用户非安全资料
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCurrentUserRequest' }
      responses:
        '200':
          description: 修改后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me/password:
    post:
      tags: [Current user]
      operationId: changePassword
      summary: 修改当前用户密码
      description: 成功后撤销当前会话之外的全部会话，并写入安全审计。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: 密码已修改 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me/settings:
    get:
      tags: [Current user]
      operationId: getCurrentUserSettings
      summary: 获取白名单用户设置
      responses:
        '200':
          description: 用户设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Current user]
      operationId: updateCurrentUserSettings
      summary: 修改白名单用户设置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsPatch' }
      responses:
        '200':
          description: 修改后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/oauth2/providers:
    get:
      tags: [OAuth2]
      operationId: listOAuth2Providers
      summary: 列出启用的第三方登录 Provider
      security: []
      responses:
        '200':
          description: Provider 列表，未配置时为空
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OAuth2Provider' }
  /auth/oauth2/{provider}/authorize:
    get:
      tags: [OAuth2]
      operationId: beginOAuth2Authorization
      summary: 开始第三方登录授权
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        '200':
          description: 短时有效的授权地址和一次性 state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2Authorization' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/oauth2/{provider}/callback:
    get:
      tags: [OAuth2]
      operationId: completeOAuth2Authorization
      summary: 处理第三方登录回调
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: code, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: state, in: query, required: true, schema: { type: string, minLength: 16 } }
      responses:
        '200':
          description: 第三方登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me/oauth2/{provider}:
    post:
      tags: [OAuth2]
      operationId: bindOAuth2Identity
      summary: 绑定第三方身份
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuth2BindRequest' }
      responses:
        '201':
          description: 绑定成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2Identity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [OAuth2]
      operationId: unbindOAuth2Identity
      summary: 解绑第三方身份
      description: 若解绑后用户没有任何可用登录方式，则返回冲突。
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '204': { description: 已解绑或原本未绑定 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users:
    get:
      tags: [Admin users]
      operationId: listUsers
      summary: 查询用户
      description: 需要 `admin` 角色。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: query, in: query, schema: { type: string, maxLength: 320 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, username, -username, last_login_at, -last_login_at]
            default: -created_at
      responses:
        '200':
          description: 用户分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin users]
      operationId: getUserAsAdmin
      summary: 查看用户详情
      responses:
        '200':
          description: 管理员用户视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin users]
      operationId: updateUserAsAdmin
      summary: 修改用户资料
      description: 不在本接口中修改角色、密码或账号封禁状态。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateUserRequest' }
      responses:
        '200':
          description: 修改后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{user_id}/ban:
    post:
      tags: [Admin users]
      operationId: banUser
      summary: 封禁用户并撤销其全部会话
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BanUserRequest' }
      responses:
        '200':
          description: 已封禁的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{user_id}/unban:
    post:
      tags: [Admin users]
      operationId: unbanUser
      summary: 解封用户
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已解封的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{user_id}/sessions:
    get:
      tags: [Admin users]
      operationId: listUserSessionsAsAdmin
      summary: 查询用户会话摘要
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 会话分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users/{user_id}/sessions/{session_id}/revoke:
    post:
      tags: [Admin users]
      operationId: revokeUserSessionAsAdmin
      summary: 撤销用户会话
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已撤销的会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{user_id}/reset-password:
    post:
      tags: [Admin users]
      operationId: beginPasswordResetAsAdmin
      summary: 创建一次性密码重置流程
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPasswordResetRequest' }
      responses:
        '202':
          description: 重置流程已创建，不返回明文密码或重置 Token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /domains:
    get:
      tags: [Domains]
      operationId: listDomains
      summary: 查询当前用户管理的域名
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: query, in: query, schema: { type: string, maxLength: 253 } }
        - { name: monitor_enabled, in: query, schema: { type: boolean } }
        - { name: expires_from, in: query, schema: { type: string, format: date-time } }
        - { name: expires_to, in: query, schema: { type: string, format: date-time } }
        - { name: last_outcome, in: query, schema: { $ref: '#/components/schemas/CheckOutcome' } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, name, -name, expires_at, -expires_at, last_check_at, -last_check_at]
            default: name
      responses:
        '200':
          description: 当前用户域名分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Domains]
      operationId: createDomain
      summary: 新增管理域名
      description: 输入通过 `DomainLookup.normalize()` 标准化；同一用户的 ASCII 域名唯一。M1 不创建刷新任务。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDomainRequest' }
      responses:
        '201':
          description: 域名已创建
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateDomainResult' }
        '200':
          description: 已软删除的同名域名已恢复
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateDomainResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /domains/{domain_id}:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    get:
      tags: [Domains]
      operationId: getDomain
      summary: 查看当前用户域名
      responses:
        '200':
          description: 域名详情
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Domains]
      operationId: updateDomain
      summary: 修改域名的本地管理属性
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDomainRequest' }
      responses:
        '200':
          description: 修改后的域名
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Domains]
      operationId: deleteDomain
      summary: 软删除当前用户域名
      description: 从默认列表隐藏，保留历史检查和安全审计；重复删除仍然成功。
      responses:
        '204': { description: 域名已软删除或原本已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /domains/{domain_id}/refresh:
    post:
      tags: [Domains]
      operationId: refreshDomain
      summary: 创建域名刷新任务
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshDomainRequest' }
      responses:
        '202':
          description: 刷新任务已接受
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /domains/{domain_id}/checks:
    get:
      tags: [Domains]
      operationId: listDomainChecks
      summary: 查询域名检查历史
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/CheckOutcome' } }
        - { name: checked_from, in: query, schema: { type: string, format: date-time } }
        - { name: checked_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 检查历史分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainCheckPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /domains/{domain_id}/checks/{check_id}:
    get:
      tags: [Domains]
      operationId: getDomainCheck
      summary: 查看单次域名检查
      description: 不暴露原始 WHOIS/RDAP 报文。
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - $ref: '#/components/parameters/CheckId'
      responses:
        '200':
          description: 检查详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: 分页查询当前用户的刷新任务
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
      responses:
        '200':
          description: 刷新任务分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: 查询当前用户的异步任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务状态
          headers:
            Retry-After:
              description: 未完成时建议的轮询间隔（秒）
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/settings/refresh-policy:
    get:
      tags: [Admin domains]
      operationId: getRefreshPolicy
      summary: 查询全局刷新策略
      responses:
        '200':
          description: 当前刷新策略
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin domains]
      operationId: updateRefreshPolicy
      summary: 更新全局刷新策略
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshPolicy' }
      responses:
        '200':
          description: 已更新的刷新策略
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/settings:
    get:
      tags: [Admin settings]
      operationId: listGlobalSettings
      summary: 获取后台全局设置
      description: Secret 设置不返回明文；密码等字段只返回是否已配置。
      responses:
        '200':
          description: 已注册的全局设置
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GlobalSetting' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/settings/{key}:
    put:
      tags: [Admin settings]
      operationId: updateGlobalSetting
      summary: 更新一项后台全局设置
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlobalSettingPatch' }
      responses:
        '200':
          description: 已更新的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalSetting' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/domains:
    get:
      tags: [Admin domains]
      operationId: listDomainsAsAdmin
      summary: 全局查询管理域名
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: query, in: query, schema: { type: string, maxLength: 253 } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: public_suffix, in: query, schema: { type: string, maxLength: 253 } }
        - { name: monitor_enabled, in: query, schema: { type: boolean } }
        - { name: expires_from, in: query, schema: { type: string, format: date-time } }
        - { name: expires_to, in: query, schema: { type: string, format: date-time } }
        - { name: last_outcome, in: query, schema: { $ref: '#/components/schemas/CheckOutcome' } }
        - name: deleted
          in: query
          schema: { type: string, enum: [exclude, include, only], default: exclude }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, name, -name, expires_at, -expires_at, last_check_at, -last_check_at]
            default: -created_at
      responses:
        '200':
          description: 全局域名分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDomainPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/domains/{domain_id}:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    get:
      tags: [Admin domains]
      operationId: getDomainAsAdmin
      summary: 查看全局域名详情
      responses:
        '200':
          description: 管理员域名视图
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminManagedDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin domains]
      operationId: updateDomainAsAdmin
      summary: 修改全局域名本地属性
      description: 域名所有权转移不属于首版通用编辑接口。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateDomainRequest' }
      responses:
        '200':
          description: 修改后的域名
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminManagedDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Admin domains]
      operationId: deleteDomainAsAdmin
      summary: 管理员软删除域名
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - name: X-Confirm-Action
          in: header
          required: true
          schema: { type: string, const: soft-delete }
      responses:
        '204': { description: 域名已软删除或原本已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/domains/{domain_id}/refresh:
    post:
      tags: [Admin domains]
      operationId: refreshDomainAsAdmin
      summary: 管理员创建强制刷新任务
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRefreshDomainRequest' }
      responses:
        '202':
          description: 刷新任务已接受并记录操作者
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/domain-checks:
    get:
      tags: [Admin domains]
      operationId: listDomainChecksAsAdmin
      summary: 全局查询域名检查历史
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: domain_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/CheckOutcome' } }
        - { name: protocol, in: query, schema: { type: string, enum: [rdap, whois] } }
        - { name: checked_from, in: query, schema: { type: string, format: date-time } }
        - { name: checked_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 全局检查历史及本页统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDomainCheckPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 短时有效的 Access Token。Refresh Token 不通过此方案传递。
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    UserId: { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    DomainId: { name: domain_id, in: path, required: true, schema: { type: string, format: uuid } }
    CheckId: { name: check_id, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: task_id, in: path, required: true, schema: { type: string, format: uuid } }
    Provider: { name: provider, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_-]{1,31}$' } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 同一用户和操作范围内的幂等键，建议使用 UUID。
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一用户和操作范围内的幂等键，建议使用 UUID。
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 使用资源 ETag（由 `version` 生成）实施乐观并发控制。
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  responses:
    Unauthorized:
      description: Access Token 缺失、无效或过期
      headers:
        WWW-Authenticate: { schema: { type: string, default: Bearer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthenticationFailed:
      description: 认证信息无效或 Refresh Token 不可用
      headers:
        WWW-Authenticate: { schema: { type: string, default: Bearer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 权限不足或账号被禁用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在；用户资源不泄露其他用户的资源归属
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 唯一性、业务状态、幂等参数或资源版本冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: 请求格式或字段校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: API 或上游注册局限流
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionRequired:
      description: 缺少 `If-Match` 并发控制头
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CreateNotificationRuleRequest:
      type: object
      additionalProperties: false
      required: [event_type, channel]
      properties:
        domain_id: { type: [string, 'null'], format: uuid }
        event_type: { type: string, enum: [expiration, status_change, query_failure] }
        days_before: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        channel: { type: string, enum: [email, webhook] }
        webhook_url: { type: [string, 'null'], format: uri }
    UpdateNotificationRuleRequest:
      type: object
      additionalProperties: false
      properties:
        domain_id: { type: [string, 'null'], format: uuid }
        event_type: { type: string, enum: [expiration, status_change, query_failure] }
        days_before: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        channel: { type: string, enum: [email, webhook] }
        webhook_url: { type: [string, 'null'], format: uri }
        enabled: { type: boolean }
    NotificationRule:
      type: object
      additionalProperties: false
      required: [id, domain_id, event_type, days_before, channel, webhook_url, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        domain_id: { type: [string, 'null'], format: uuid }
        event_type: { type: string, enum: [expiration, status_change, query_failure] }
        days_before: { type: [integer, 'null'] }
        channel: { type: string, enum: [email, webhook] }
        webhook_url: { type: [string, 'null'], format: uri }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationDelivery:
      type: object
      additionalProperties: false
      required: [id, domain_id, event_type, channel, status, attempt_count, available_at, sent_at, failure_reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        domain_id: { type: string, format: uuid }
        event_type: { type: string, enum: [expiration, status_change, query_failure] }
        channel: { type: string, enum: [email, webhook] }
        status: { type: string, enum: [pending, running, sent, dead_letter] }
        attempt_count: { type: integer, minimum: 0 }
        available_at: { type: [string, 'null'], format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }
        failure_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { type: string, examples: [invalid_request] }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [location, message]
            properties:
              location: { type: string }
              message: { type: string }
              code: { type: string }
        request_id: { type: string }
    UserRole: { type: string, enum: [user, admin] }
    UserStatus: { type: string, enum: [active, banned] }
    AdminSession:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, absolute_expires_at, revoked_at, revoke_reason]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoke_reason: { type: [string, 'null'] }
    AdminSessionPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminSession' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$' }
        password: { type: string, format: password, minLength: 6, maxLength: 256 }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 320 }
        password: { type: string, format: password, minLength: 1, maxLength: 256 }
        scope: { type: string, default: '' }
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, minimum: 1, description: Access Token 有效秒数 }
    AuthResult:
      type: object
      additionalProperties: false
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
    UpdateCurrentUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email: { type: [string, 'null'], format: email, maxLength: 320 }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password, minLength: 1, maxLength: 256 }
        new_password: { type: string, format: password, minLength: 6, maxLength: 256 }
    UserSettings:
      type: object
      additionalProperties: false
      required: [locale, timezone, default_monitor_enabled]
      properties:
        locale: { type: string, enum: [zh-CN, en-US], default: zh-CN }
        timezone: { type: string, default: UTC, description: IANA timezone name }
        default_monitor_enabled: { type: boolean, default: true }
        expiration_warning_days:
          type: array
          uniqueItems: true
          maxItems: 10
          items: { type: integer, minimum: 0, maximum: 365 }
    UserSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        locale: { type: string, enum: [zh-CN, en-US] }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        default_monitor_enabled: { type: boolean }
        expiration_warning_days:
          type: array
          uniqueItems: true
          maxItems: 10
          items: { type: integer, minimum: 0, maximum: 365 }
    OAuth2Provider:
      type: object
      additionalProperties: false
      required: [key, display_name]
      properties:
        key: { type: string }
        display_name: { type: string }
    OAuth2Authorization:
      type: object
      additionalProperties: false
      required: [authorization_url, state, expires_at]
      properties:
        authorization_url: { type: string, format: uri }
        state: { type: string }
        expires_at: { type: string, format: date-time }
    OAuth2BindRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string, minLength: 1 }
        state: { type: string, minLength: 16 }
    OAuth2Identity:
      type: object
      additionalProperties: false
      required: [provider, provider_username, bound_at]
      properties:
        provider: { type: string }
        provider_username: { type: [string, 'null'] }
        bound_at: { type: string, format: date-time }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, role, status, created_at, updated_at, domain_count]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        domain_count: { type: integer, minimum: 0 }
        banned_at: { type: [string, 'null'], format: date-time }
        ban_reason: { type: [string, 'null'] }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    AdminUpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        settings: { $ref: '#/components/schemas/UserSettingsPatch' }
    BanUserRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 512 }
    AdminPasswordResetRequest:
