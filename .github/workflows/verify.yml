name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra api --group dev
      - run: uv run ruff format --check domainsmanager_api/api/domains.py domainsmanager_api/schemas/domains.py domainsmanager_api/schemas/admin.py domainsmanager_api/schemas/admin_domains.py domainsmanager_api/schemas/global_settings.py domainsmanager_application/domains.py domainsmanager_persistence/domains.py migrations/versions/d4e7f1c9a862_add_managed_domain_soft_delete.py migrations/versions/b7c6d5e4f3a2_add_admin_query_indexes.py tests/api/test_domains.py tests/api/test_admin.py tests/test_admin_indexes.py tests/test_postgres_admin_concurrency.py tests/test_domain_persistence.py tests/test_resources.py
      - run: uv run ruff check domainsmanager_api/api/domains.py domainsmanager_api/schemas/domains.py domainsmanager_api/schemas/admin.py domainsmanager_api/schemas/admin_domains.py domainsmanager_api/schemas/global_settings.py domainsmanager_application/domains.py domainsmanager_persistence/domains.py migrations/versions/d4e7f1c9a862_add_managed_domain_soft_delete.py migrations/versions/b7c6d5e4f3a2_add_admin_query_indexes.py tests/api/test_domains.py tests/api/test_admin.py tests/test_admin_indexes.py tests/test_postgres_admin_concurrency.py tests/test_domain_persistence.py tests/test_resources.py
      - run: uv run pytest -m "not network and not postgres" -ra
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: domainsmanager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domainsmanager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOMAINSMANAGER_RUN_POSTGRES_TESTS: "1"
      DOMAINSMANAGER_TEST_DATABASE_TYPE: postgresql
      DOMAINSMANAGER_TEST_DATABASE_HOST: 127.0.0.1
      DOMAINSMANAGER_TEST_DATABASE_PORT: "5432"
      DOMAINSMANAGER_TEST_DATABASE_NAME: domainsmanager_test
      DOMAINSMANAGER_TEST_DATABASE_USER: postgres
      DOMAINSMANAGER_TEST_DATABASE_PASSWORD: postgres
      DOMAINSMANAGER_TEST_DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra api --group dev
      - run: uv run pytest -m postgres -ra
