[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "domainsmanager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.0",
    "httpx>=0.28.1",
    "idna>=3.18",
    "pydantic>=2.13.4",
    "tldextract>=5.3.1",
]

[project.scripts]
domainsmanager-api = "domainsmanager_api.cli:main"
domainsmanager-server = "domainsmanager_api.server:main"
domainsmanager-worker = "domainsmanager_api.worker:main"
domainsmanager-scheduler = "domainsmanager_api.scheduler:main"
domainsmanager-notifier = "domainsmanager_api.notifier_worker:main"
domainsmanager-seed = "domainsmanager_api.seed:main"
domainsmanager-cleanup = "domainsmanager_api.cleanup:main"
domainsmanager-migrate = "domainsmanager_api.migrate:main"

[project.optional-dependencies]
api = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.2.0",
    "fastapi>=0.116.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.10.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.51",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35.0",
]
persistence = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[tool.hatch.build.targets.wheel]
packages = [
    "domainsmanager_api",
    "domainsmanager_application",
    "domainsmanager_lookup",
    "domainsmanager_persistence",
    "modules",
]
exclude = ["modules/qwhois.py"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "domainsmanager_persistence/alembic.ini"
"migrations" = "domainsmanager_persistence/migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--timeout=15"]
markers = [
    "unit: isolated unit tests",
    "contract: public and adapter contract tests",
    "integration: offline component integration tests",
    "compat: legacy import compatibility tests",
    "package: package boundary tests",
    "network: tests that explicitly require external network access",
    "concurrency: asynchronous concurrency tests",
    "regression: tests for previously observed behavior",
    "api: FastAPI HTTP interface tests",
    "postgres: tests requiring a dedicated PostgreSQL instance",
]

[tool.coverage.run]
branch = true
source = [
    "domainsmanager_api",
    "domainsmanager_application",
    "domainsmanager_lookup",
    "domainsmanager_persistence",
]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.uv.index]]
url="https://pypi.tuna.tsinghua.edu.cn/simple"
default=true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "email-validator>=2.2.0",
    "fastapi>=0.116.0",
    "hatchling>=1.31.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.10.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.0",
    "pytest-timeout>=2.4.0",
    "tzdata>=2025.2",
    "ruff>=0.16.3",
]
